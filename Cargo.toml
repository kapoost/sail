[workspace]
resolver = "2"
members = ["crates/sail-core", "crates/sail-net", "crates/sail-app", "crates/sail-bios"]

[workspace.package]
edition = "2021"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glam = "0.34"

# Simulation correctness depends on float determinism, not on speed, but the
# validation suite integrates ~10^5 steps per test. Optimise test builds.
[profile.test]
opt-level = 2

# And a profile for the thing a browser downloads, where the bill is in bytes rather
# than in seconds. Same optimisation as `dist` — fat link-time optimisation, one codegen
# unit — plus the one that matters most on this target: `strip`, because the debug
# information in a wasm module is most of the module. Measured on this game: 144 MB
# without it.
[profile.web]
inherits = "dist"
# Aborting rather than unwinding. A panic in a tab is a page that has stopped either way;
# the unwinding tables are bytes down the wire for a recovery nobody performs.
panic = "abort"

# A profile for the thing you hand to somebody else.
#
# Separate from `release` on purpose. Fat link-time optimisation across a single codegen
# unit takes minutes rather than seconds, and `release` is what gets rebuilt forty times
# an afternoon — paying distribution's bill on every one of those would be a tax on the
# work. CI builds `--profile dist`; a person building to sail builds `--release`.
#
# What it buys, measured on this binary: 138 MB stripped and linked down to something a
# friend will actually download.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
