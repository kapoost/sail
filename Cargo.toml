[workspace]
resolver = "2"
members = ["crates/sail-core", "crates/sail-app"]

[workspace.package]
edition = "2021"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glam = "0.34"

# Simulation correctness depends on float determinism, not on speed, but the
# validation suite integrates ~10^5 steps per test. Optimise test builds.
[profile.test]
opt-level = 2
