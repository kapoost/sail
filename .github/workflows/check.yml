# Every push: the tests, the lints, and the browser build's compiler.
#
# **There was no such job until now**, which is the quiet reason several things in this
# repository were broken for a while without anybody noticing: `cargo test` and `clippy`
# ran on one laptop, on one operating system, whenever somebody remembered. The two
# workflows beside this one build the site and cut releases; neither of them runs a test.
#
# One runner, not three. A Bevy build from cold takes the best part of an hour on the
# Windows image and about half that on macOS — paying that on every push to catch a
# platform difference that turns up once a quarter is the wrong trade. What is
# platform-specific here is a handful of `#[cfg]` branches around file paths, and the
# release workflow compiles all three on a tag, which is when it matters. What this job
# catches is everything else: the model, the schedule, the eight hundred assertions.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Bevy wants ALSA and udev headers on Linux even for a test binary that never
      # opens a window: the audio and gamepad backends are linked, not loaded.
      - name: The system libraries Bevy links against
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release
      # And the one platform difference worth paying for on every push, because it is the
      # one that breaks silently and is published automatically: the browser build has its
      # own `#[cfg]` paths — no clock, no filesystem, no environment — and a change that
      # compiles here can fail there. A `check` rather than a build: the question is
      # whether it compiles, and `dist/web.sh` answers the rest when the site is built.
      - run: cargo check --target wasm32-unknown-unknown -p sail-app --features webgpu
