name: pages

# The page is generated rather than written, and this is where that happens. The key
# list comes out of `crates/sail-app/src/help.rs`, the polar and the model table out of
# `README.md`, the version out of `Cargo.toml` — so a page that disagrees with the
# program is a build failure here rather than something a reader finds first.
#
# **And the game itself is published with it**, at `/play/`: a wasm build served beside
# the pages. That is why this workflow now compiles Rust and why it watches the whole
# crate rather than one file of it. The cost is honest and worth naming: a cold run
# builds the engine for a target the cache has never seen, which is twenty minutes or
# so; a warm one rebuilds `sail-app` alone and is a few. The site therefore waits for
# the game — deliberately, because a page advertising a demo that failed to build is
# worse than a page published a quarter of an hour later.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "README.md"
      - "crates/**"
      - "assets/**"
      - "dist/web/**"
      - "dist/web.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A half-published site is worse than an old one: let a run finish rather than
# cancelling it partway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The playable build. Its own job so that the cache it needs — a Rust target
  # directory for `wasm32-unknown-unknown` — is not mixed up with a job whose other
  # half is Python and a PDF.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      # Belt and braces: `rust-toolchain.toml` says `stable`, which is the toolchain the
      # action set up — but the target has to be present for whichever toolchain rustup
      # actually selects when cargo runs in this directory, and that is cheap to make
      # certain of.
      - run: rustup target add wasm32-unknown-unknown

      # `wasm-bindgen-cli` must match the `wasm-bindgen` in the lockfile exactly or the
      # module it produces will not load, so the version is read from the lockfile
      # rather than written down twice. Cached by that version: installing it is three
      # minutes and it changes about twice a year.
      - name: the binder, at the version the lockfile says
        run: |
          want=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[^0-9.]/, "", $0); print; exit}' Cargo.lock)
          echo "WASM_BINDGEN_VERSION=$want" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ env.WASM_BINDGEN_VERSION }}
      - run: |
          if ! command -v wasm-bindgen >/dev/null; then
            cargo install -f wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"
          fi

      - name: build the game for a browser
        run: dist/web.sh

      # The one check that matters here: a module that is a few kilobytes is a build
      # that produced a stub, and nothing downstream would notice.
      - name: it is a game and not a stub
        run: |
          test -s dist/out/web/sail-app_bg.wasm
          test -s dist/out/web/index.html
          test -s dist/out/web/assets/sea_wave.wesl
          size=$(du -m dist/out/web/sail-app_bg.wasm | cut -f1)
          echo "wasm: ${size} MB"
          [ "$size" -gt 10 ] || { echo "that is not the whole game"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/out/web
          retention-days: 1

  build:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist/out/web

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # WeasyPrint draws the PDF. It needs pango and cairo from the system rather than
      # from pip, and the runner image has neither by default.
      - name: the things that draw a PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi-dev
          python -m pip install --upgrade pip
          python -m pip install weasyprint

      # Before building anything: does the parse still understand help.rs? This is the
      # check that stops a renamed constant from quietly publishing half a key list.
      - name: the key list still parses
        run: python3 site/keys.py

      - name: build
        run: python3 site/build.py --pdf --play dist/out/web

      # A page that built but came out empty is the failure this catches. The build
      # itself now refuses to finish if any local reference is missing — added after a
      # deploy that was green while the moving picture and the help screenshot were
      # both 404, because nothing copied them and nothing looked.
      - name: the output is not a shell
        run: |
          # Both languages, because checking only the English one would let a Polish
          # build that produced nothing go out green — the same shape of failure as a
          # picture that is referenced and never copied.
          for dir in "" "pl/"; do
            test -s "_site/${dir}index.html"
            test -s "_site/${dir}manual.html"
            test -s "_site/${dir}manual.pdf"
            # The key list is English in both versions on purpose; its presence is
            # what says the generated half of the page actually ran.
            grep -q "AT THE HELM" "_site/${dir}index.html"
            grep -q "AT THE HELM" "_site/${dir}manual.html"
            echo "${dir:-en/}: index $(wc -c < "_site/${dir}index.html") bytes, pdf $(wc -c < "_site/${dir}manual.pdf") bytes"
          done
          # And the Polish page is in Polish rather than a copy of the English one.
          grep -q "symulator" _site/pl/index.html || { echo "pl/index.html is not Polish"; exit 1; }
          for f in $(grep -o 'shots/[a-z]*\.webp' _site/index.html | sort -u); do
            test -s "_site/$f" || { echo "missing: $f"; exit 1; }
          done
          echo "pictures: $(ls _site/shots | tr '\n' ' ')"
          # And the game that is published with the page: the module, the page that
          # starts it, the shaders it fetches, and the link that gets anybody there.
          test -s _site/play/sail-app_bg.wasm
          test -s _site/play/index.html
          test -s _site/play/assets/sea_wave.wesl
          grep -q 'href="play/"' _site/index.html
          grep -q 'href="../play/"' _site/pl/index.html
          echo "play: $(du -m _site/play/sail-app_bg.wasm | cut -f1) MB of wasm"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
