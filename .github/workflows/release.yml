name: release

# Built on the runners rather than cross-compiled from a laptop, and that is the whole
# reason this file exists. Mac to Windows is the one step that reliably costs an
# afternoon — Bevy through mingw has its own linker arguments, and the MSVC toolchain is
# not on macOS at all — while a Windows runner builds it natively with nothing special.
# The same argument runs the other way for anyone who only has a PC.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Both architectures, joined with lipo: an Intel Mac is still a Mac somebody has.
      - run: cargo build --profile dist -p sail-app --target aarch64-apple-darwin
      - run: cargo build --profile dist -p sail-app --target x86_64-apple-darwin
      # The relay, for whoever is hosting a game. Tiny — no engine in its tree — so
      # building it for both architectures costs seconds.
      # The Windows installer gets parsed by the only machine in this pipeline that can
      # parse it. It is written on a Mac, and the fault it shipped with was an apostrophe
      # inside a single-quoted string — "the game's own menu" — which PowerShell reads as
      # the end of the string and then complains about a line forty rows further down.
      # Nothing on a Mac was ever going to catch that; a Windows runner catches it in a
      # second.
      - name: the installer has to parse
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'dist/install.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw 'dist/install.ps1 does not parse'
          }
          Write-Host 'dist/install.ps1 parses'
      - run: cargo build --profile dist -p sail-net --bin sail-server --target aarch64-apple-darwin
      - run: cargo build --profile dist -p sail-net --bin sail-server --target x86_64-apple-darwin
      - run: bash dist/make-app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/out/Sail-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --profile dist -p sail-app
      - run: cargo build --profile dist -p sail-net --bin sail-server
      # One file, genuinely: the hull is inside it and so are the licences, which
      # `Sail.exe --licences` prints.
      - run: mkdir out
      - run: copy target\dist\sail-app.exe out\Sail.exe
        shell: cmd
      - run: copy target\dist\sail-server.exe out\sail-server.exe
        shell: cmd
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            out/Sail.exe
            out/sail-server.exe

  # The relay for a Linux box, which is where it actually lives: a four-euro VPS, or a
  # machine somebody already rents for something else. Statically linked against musl so
  # that one file runs on Debian, Ubuntu, Alpine and whatever the provider's image is —
  # a glibc build made on the newest Ubuntu refuses to start on a two-year-old Debian,
  # and finding that out over ssh is a bad evening.
  #
  # No Bevy in this tree, so the whole job is a couple of minutes.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # rust-lld rather than a cross toolchain from apt: there is no C in this crate's
      # tree, so the linker that comes with rustup is enough and the job needs nothing
      # installed.
      - run: cargo build --release -p sail-net --bin sail-server --target x86_64-unknown-linux-musl
      - run: cargo build --release -p sail-net --bin sail-server --target aarch64-unknown-linux-musl
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C linker=rust-lld
      - run: |
          mkdir -p out
          cp target/x86_64-unknown-linux-musl/release/sail-server out/sail-server
          cp target/aarch64-unknown-linux-musl/release/sail-server out/sail-server-arm64
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            out/sail-server
            out/sail-server-arm64

  # Only a tag is a release. Dispatching this by hand is how you get the three binaries
  # without cutting one — for a server that has to be updated between releases, which
  # happened twice on the day this line was written — and without the guard that run ends
  # red every time, on "GitHub Releases requires a tag". A workflow that is always a
  # little bit failed is a workflow nobody reads.
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # **Uploaded and downloaded by the same generation.** The artifact actions are a
      # matched pair — the store they talk to changed under them at v4 and again since —
      # so these two move together with the three `upload-artifact` steps above or the
      # release ends with no files on it. Downloading *everything* keeps the per-name
      # folders the `files:` list below is written against; the v5 break was to single
      # downloads by id, which this is not.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - run: ls -R artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/macos/Sail-macos.zip
            artifacts/windows/Sail.exe
            artifacts/windows/sail-server.exe
            artifacts/linux/sail-server
            artifacts/linux/sail-server-arm64
            assets/ATTRIBUTION.md
            assets/VT323-OFL.txt
          body: |
            A sailing simulator. One file each way, nothing to install.

            ## macOS

            Paste this into Terminal:

            ```
            curl -fsSL https://raw.githubusercontent.com/kapoost/sail/main/dist/install.sh | sh
            ```

            It puts the game in `~/Applications`, brings `sail-server` with it, and
            opens by double-clicking from then on. Run the same line again for the
            next version.

            **Why a line in Terminal and not just the zip.** A Mac refuses to open an
            application that nobody has paid Apple to vouch for, and the refusal says
            *"Sail is damaged and can't be opened"* when the file is not damaged in
            any way. The old way past it — right-click, Open — **Apple removed in
            macOS 15**, so the instruction in every older copy of these notes no
            longer works. The quarantine that causes all this is put on by the
            program that *downloads* the file: a browser marks what it saves, `curl`
            does not. So a copy that arrives through that line has nothing on it to
            get past.

            If you would rather do it by hand: download `Sail-macos.zip`, unzip it,
            and then either

            ```
            xattr -dr com.apple.quarantine /path/to/Sail.app
            ```

            or double-click it, let it be refused, and go to **System Settings →
            Privacy & Security**, scroll to the bottom, and press **Open Anyway**.

            Universal: Apple Silicon and Intel.

            ## Windows

            Paste this into **PowerShell** — press Start, type `powershell`, press
            Enter, and paste it there:

            ```
            irm https://raw.githubusercontent.com/kapoost/sail/main/dist/install.ps1 | iex
            ```

            **`irm` is not recognized?** Then it went into the Command Prompt rather than
            into PowerShell — `irm` is a PowerShell word and `cmd` has never heard of it.
            This line works from either, and from the Run box as well:

            ```
            powershell -NoProfile -ExecutionPolicy Bypass -Command "[Net.ServicePointManager]::SecurityProtocol='Tls12'; irm https://raw.githubusercontent.com/kapoost/sail/main/dist/install.ps1 | iex"
            ```

            The two extra pieces are for older machines: `-ExecutionPolicy Bypass` for
            one that refuses to run scripts at all, and the TLS line for a Windows 10
            whose PowerShell still opens connections with a protocol GitHub stopped
            accepting years ago.

            It puts the game in `%LOCALAPPDATA%\Sail`, brings `sail-server.exe` with
            it, adds a Start menu entry, and asks for no administrator rights. Run
            the same line again for the next version.

            **Why a line in PowerShell and not just the exe.** *"Windows protected
            your PC"* comes from the mark of the web — a tag the program doing the
            *downloading* attaches. A browser attaches it; `Invoke-WebRequest` does
            not. So a copy that arrives through that line has nothing on it for
            SmartScreen to object to.

            By hand instead: download `Sail.exe`, run it, click **More info** and
            then **Run anyway**.

            ## Sailing together

            One of you runs `sail-server` (it comes with the macOS install and sits
            beside `Sail.exe` on Windows):

            ```
            sail-server --seed 42
            ```

            **On a server of your own**, so the game is there when you are not, there is
            a Linux build in the files below — `sail-server` for an ordinary machine and
            `sail-server-arm64` for an ARM one, both static, nothing to install. One
            line puts it there as a service:

            ```
            curl -fsSL https://raw.githubusercontent.com/kapoost/sail/main/dist/install-server.sh | sudo sh
            ```

            It writes a word into `/etc/sail-server.env` and prints it. Everybody who is
            sailing types the address and that word into the **TOGETHER** page. Without a
            word anybody who finds the port can join, which is fine on your own wifi and
            not on a public address.

            Everybody else presses **Esc** in the game and opens the **TOGETHER**
            page: a game on the same network is in the list and joining is one click.
            Over the internet, put the host's address in the box underneath — if
            everybody is on one Tailscale or ZeroTier network, that address works
            unchanged and nothing has to be forwarded.

            The world comes from whoever is hosting: join and you are in their
            archipelago, in their weather, at their time of day.

            The hull model and the font are inside the executable; `Sail.exe
            --licences` or `Sail.app/Contents/MacOS/sail --licences` prints their
            terms.

            **The keys** are on the `?` in the bottom-right corner of the window, or
            press `?` or `F1`. They live in the program rather than here, because the
            first version of this list had three of them wrong.

            **If you have never sailed one**, press `Esc` and open the **DRILL** page.
            It talks you through making her go, and then somebody goes over the side
            and you have to get them back — which is the one piece of boat handling
            where being bad at it costs a life, and the one nobody practises.
