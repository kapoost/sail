[package]
name = "sail-bios"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The one dependency, and it is a terminal rather than a framework: raw mode, cursor
# moves and colours. Everything above that — the layout, the fields, the help pane — is
# in `main.rs`, because a BIOS screen is six boxes and a highlighted row and a widget
# library for that would be more code than the thing it drew.
[dependencies]
crossterm = "0.29"
# For the one thing the launcher and the game must agree about: the file the game
# remembers an address and a word in. A second parser for it would be a small thing to
# get wrong and a silent one.
sail-net = { path = "../sail-net" }
