[package]
name = "sail-app"
version = "0.1.24"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Presentation layer: window, rendering, input, HUD. The only crate that knows about a game engine."

[dependencies]
sail-core = { path = "../sail-core" }
sail-net = { path = "../sail-net" }
# Pinned on purpose. Bevy ships breaking changes roughly every quarter; an engine
# upgrade is scheduled work with its own budget, not a side effect of `cargo update`.
bevy = "=0.20.0"
bevy_egui = "=0.43.1"
glam.workspace = true
# One struct crosses to the card as bytes, and this is the crate that says in the type
# system when that is allowed. Already in the tree — the renderer is built on it.
bytemuck = "1"

# A tab has no environment to read dials from and no clock in `std`: the query string
# answers both, and these are the two crates that ask the page about itself. Only on
# wasm — a desk build has `std::env` and a working `SystemTime`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }

# The browser build picks its graphics backend explicitly, and it has to be WebGPU: the
# sea reads its spectrum out of a storage buffer, and WebGL2 has no such thing.
[features]
webgpu = ["bevy/webgpu"]

[dev-dependencies]
# The sea's shader is compiled and *run* by a test, against the Rust spectrum it has to
# agree with. Pinned to the version the renderer itself uses, so the test exercises the
# same compiler the game does.
wgpu = "=30.0.1"
pollster = "0.4"
